[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-first-adventure-game"
version = "0.1.0"
description = "A reusable foundation for building top-down 2D adventure games with Pygame."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Vincent Mardon" },
]
dependencies = [
  "pygame>=2.6.1,<3",
]

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
  "ruff",
]

[project.scripts]
my-first-adventure-game = "my_first_adventure_game.game.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"